name: Build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Release
        run: dotnet build .\CorePin.sln -c Release --artifacts-path .\artifacts\ci-build
      - name: Managed checks
        run: dotnet .\artifacts\ci-build\bin\CorePin.Checks\release\CorePin.Checks.dll
      - name: Native checks (own process only)
        run: dotnet .\artifacts\ci-build\bin\CorePin.Checks\release\CorePin.Checks.dll --native
      - name: Source and UTF-8 checks
        shell: powershell
        run: |
          & .\scripts\Check-Source.ps1
          & .\scripts\Test-Text.ps1
      - name: Publish and verify default self-contained zip
        shell: powershell
        run: |
          & .\scripts\Publish-Release.ps1
          & .\scripts\Test-Package.ps1 -PackagePath .\artifacts\corepin-selfcontained\CorePin-win-x64.zip -VerificationRoot .\artifacts\ci-package-verify
      - name: Retain runtime verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-verification
          path: |
            artifacts/ci-package-verify-result.json
            artifacts/ci-package-verify-host-trace.txt
          if-no-files-found: error
