name: Prepare or publish win-x64 release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release using an existing tag
        type: boolean
        default: false
      tag:
        description: Existing v-prefixed tag (required when publishing manually)
        type: string
        required: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Validate manual publish tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9][A-Za-z0-9._-]*$') { throw 'Specify an existing v-prefixed version tag.' }
      - uses: actions/checkout@v4
        with:
          # Manual publication must build the selected tag, not an unrelated branch tip.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and test separately from packaging
        shell: pwsh
        run: |
          dotnet build .\CorePin.sln -c Release --artifacts-path .\artifacts\release-checks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet .\artifacts\release-checks\bin\CorePin.Checks\release\CorePin.Checks.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet .\artifacts\release-checks\bin\CorePin.Checks\release\CorePin.Checks.dll --native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source and UTF-8 checks
        shell: powershell
        run: |
          & .\scripts\Check-Source.ps1
          & .\scripts\Test-Text.ps1
      - name: Publish complete self-contained package
        shell: powershell
        run: |
          & .\scripts\Publish-Release.ps1 -OutputRoot .\artifacts\release-package
          & .\scripts\Test-Package.ps1 -PackagePath .\artifacts\release-package\CorePin-win-x64.zip -VerificationRoot .\artifacts\release-verify
      - uses: actions/upload-artifact@v4
        with:
          name: CorePin-win-x64
          path: |
            artifacts/release-package/CorePin-win-x64.zip
            artifacts/release-package/CorePin-win-x64.zip.sha256
          if-no-files-found: error
      - name: Retain runtime verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-package-verification
          path: |
            artifacts/release-verify-result.json
            artifacts/release-verify-host-trace.txt
          if-no-files-found: error

  publish:
    needs: package
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CorePin-win-x64
          path: release-assets
      - name: Publish assets for an existing tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG .\release-assets\CorePin-win-x64.zip .\release-assets\CorePin-win-x64.zip.sha256 --verify-tag --title "CorePin $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
